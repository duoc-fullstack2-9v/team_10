name: Deploy to AWS S3

on:
  push:
    branches:
      - feature/integracion-microservicios-aws  # Se activa solo en esta rama
  workflow_dispatch:  # Permite ejecución manual

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
        env:
          # Variables de entorno para el build si las necesitas
          NODE_ENV: production
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Verify S3 access
        run: |
          echo "Testing S3 access..."
          aws s3 ls s3://${{ secrets.AWS_S3_BUCKET }} || echo "⚠️ Cannot list bucket, but will try to upload"
      
      - name: Deploy to S3
        run: |
          # Sync files to S3
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --cache-control max-age=31536000,public
          
          # Update index.html with no-cache
          aws s3 cp dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control no-cache,no-store,must-revalidate
      
      - name: Deployment successful
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Website URL: http://${{ secrets.AWS_S3_BUCKET }}.s3-website-${{ secrets.AWS_REGION }}.amazonaws.com"
